<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57a8f8"/>
      <stop offset=".52" stop-color="#2e6fd6"/>
      <stop offset="1" stop-color="#1b3f92"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2138"/>
      <stop offset="1" stop-color="#06111d"/>
    </linearGradient>
    <linearGradient id="mgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8e0ff"/>
      <stop offset="1" stop-color="#4aa3ff"/>
    </linearGradient>
    <radialGradient id="hl" cx=".26" cy=".16" r="1">
      <stop offset="0" stop-color="rgba(255,255,255,.30)"/>
      <stop offset=".55" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,.5)"/>
      <stop offset=".5" stop-color="rgba(255,255,255,.06)"/>
      <stop offset="1" stop-color="rgba(255,255,255,.28)"/>
    </linearGradient>
  </defs>

  <!-- 底板：对角渐变 + 高光 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#hl)"/>

  <!-- 电路走线（制造感） -->
  <g stroke="rgba(255,255,255,.16)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M56 396 H132 V444"/>
    <path d="M96 448 V408"/>
    <path d="M456 108 H384 V64"/>
    <path d="M420 132 V96"/>
  </g>
  <g fill="rgba(255,255,255,.22)">
    <circle cx="56" cy="396" r="7"/>
    <circle cx="96" cy="452" r="7"/>
    <circle cx="456" cy="108" r="7"/>
    <circle cx="420" cy="88" r="7"/>
  </g>

  <!-- 手机本体 -->
  <rect x="146" y="88" width="220" height="336" rx="42" fill="url(#glass)" stroke="#f2f8ff" stroke-width="15"/>
  <rect x="146" y="88" width="220" height="336" rx="42" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- 听筒 -->
  <rect x="234" y="104" width="44" height="10" rx="5" fill="#e8f2ff" opacity=".85"/>

  <!-- 屏内 M 字标（斜笔先画、竖笔盖接点） -->
  <g>
    <path d="M205 172 L256 280 L307 172" stroke="url(#mgrad)" stroke-width="28" fill="none" stroke-linecap="butt"/>
    <rect x="190" y="152" width="27" height="206" rx="7" fill="url(#mgrad)"/>
    <rect x="295" y="152" width="27" height="206" rx="7" fill="url(#mgrad)"/>
    <circle cx="256" cy="284" r="12" fill="#b8e0ff"/>
  </g>

  <!-- 屏幕顶部高光 -->
  <rect x="163" y="128" width="186" height="64" rx="14" fill="rgba(255,255,255,.08)"/>
</svg>
